[project]
name = "daily-ai-insight-engine"
version = "0.1.0"
description = "Harnessed deterministic MVP pipeline for daily AI insight reports."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "pytest>=8.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
daily-ai-insight = "daily_ai_insight.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
